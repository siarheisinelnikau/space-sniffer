name: Release from GitHub
'on':
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a NEW version after all checks (unchecked: artifacts only)'
        type: boolean
        default: false
  push:
    branches:
    - main
    paths:
    - .github/workflows/release-from-github.yml
    - .github/workflows/release-build.yml
    - release/**
permissions:
  contents: read
concurrency:
  group: release-from-github
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Check release tooling
      run: |-
        python3 -m unittest discover -s release -p 'test_*.py'
        node --test release/test_github.cjs
    - name: Read the exact source version
      id: meta
      run: |-
        python3 release/prepare.py metadata > metadata.json
        echo "json=$(cat metadata.json)" >> "$GITHUB_OUTPUT"
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        RELEASE_METADATA: ${{ steps.meta.outputs.json }}
        RELEASE_PUBLISH: ${{ inputs.publish }}
      with:
        script: await require('./release/github.cjs').preflight({github, context, core});
  build:
    needs: preflight
    uses: ./.github/workflows/release-build.yml
  stage:
    needs:
    - preflight
    - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: windows-executable
        path: .release-input/windows-executable
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ubuntu-package
        path: .release-input/ubuntu-package
    - name: Validate packages, notices and checksums
      run: python3 release/prepare.py stage
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-candidate
        path: .release-stage/*
        if-no-files-found: error
        retention-days: 14
        include-hidden-files: true
  publish:
    if: inputs.publish
    needs:
    - preflight
    - stage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-candidate
        path: .release-stage
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      with:
        script: await require('./release/github.cjs').publish({github, context, core});
