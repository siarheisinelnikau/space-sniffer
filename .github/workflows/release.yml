name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --locked --all-targets --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: target/x86_64-pc-windows-msvc/release/space-sniffer.exe
          if-no-files-found: error

  publish:
    name: Publish standalone executable
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: release
      - name: Publish executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/space-sniffer.exe --clobber
          else
            gh release create "$RELEASE_TAG" release/space-sniffer.exe \
              --verify-tag --title "Space Sniffer $RELEASE_TAG" --generate-notes
          fi
      - name: Keep the latest release only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          test "$asset" = "space-sniffer.exe"
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')
          if [ "$latest" != "$RELEASE_TAG" ]; then
            echo "Keeping newer release $latest; skipping cleanup for $RELEASE_TAG."
            exit 0
          fi
          gh release list --limit 1000 --json tagName --jq '.[].tagName' > previous-releases.txt
          while IFS= read -r previous_tag; do
            if [ "$previous_tag" != "$RELEASE_TAG" ]; then
              gh release delete "$previous_tag" --yes
            fi
          done < previous-releases.txt
