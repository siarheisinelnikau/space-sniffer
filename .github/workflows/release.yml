name: Release

on:
  push:
    branches: ['release/v0.6.4']

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_SOURCE_SHA: '80fee2ddc819f85c09e74a163768547f886945d0'

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_sha: ${{ steps.version.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Verify release version
        id: version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'space-sniffer').version
          $releaseTag = $env:RELEASE_REF -replace '^release/', ''
          if ($releaseTag -ne "v$version") {
            throw "Release ref $env:RELEASE_REF must match package version v$version for in-app updates."
          }
          $notes = "docs/release-notes/$releaseTag.md"
          if (!(Test-Path -LiteralPath $notes -PathType Leaf) -or (Get-Item -LiteralPath $notes).Length -eq 0) {
            throw "Add verified English release notes at $notes before tagging."
          }
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Test draft recovery without GitHub requests
        run: node --test scripts/test_publish_release.cjs
      - name: Formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Stage versioned executable
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $assetName = "SpaceSniffer-${env:RELEASE_TAG}-windows-amd64.exe"
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/release/space-sniffer.exe -Destination "release/$assetName"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: |
            release/SpaceSniffer-${{ steps.version.outputs.release_tag }}-windows-amd64.exe
          if-no-files-found: error

  ubuntu:
    name: Build Ubuntu package
    runs-on: ubuntu-22.04
    outputs:
      release_sha: ${{ steps.version.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libssl-dev xvfb xauth \
            desktop-file-utils dpkg-dev
      - name: Verify release version
        id: version
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          python3 - <<'PYCODE'
          import os, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          tag = os.environ['RELEASE_REF'].removeprefix('release/')
          assert tag == f'v{version}', 'Release ref must match Cargo version'
          assert Path(f'docs/release-notes/{tag}.md').stat().st_size > 100
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              output.write(f"release_sha={commit}\n")
          PYCODE
      - name: Test and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          python3 -m unittest discover -s scripts -p 'test_package*.py'
      - name: Check X11 startup and Updates
        run: |
          cargo build --locked --features screenshots
          python3 scripts/smoke_linux.py
      - name: Build normal release package
        run: |
          cargo build --locked --release
          python3 scripts/package_linux.py
          desktop-file-validate packaging/linux/space-sniffer.desktop
          dpkg-deb --info target/debian/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-package
          path: target/debian/*.deb
          if-no-files-found: error

  publish:
    name: Publish Windows and Ubuntu updates
    needs: [build, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.release_sha }}
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-package
          path: release
      - name: Verify matching builds
        env:
          WINDOWS_SHA: ${{ needs.build.outputs.release_sha }}
          UBUNTU_SHA: ${{ needs.ubuntu.outputs.release_sha }}
        run: test "$WINDOWS_SHA" = "$UBUNTU_SHA" && test "$WINDOWS_SHA" = "$RELEASE_SOURCE_SHA"
      - name: Resume only the owned draft and publish verified assets
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        with:
          script: |
            const publish = require('./scripts/publish_release.cjs');
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;
            const repo = context.repo;
            if (context.eventName !== 'push' || context.ref !== 'refs/heads/release/v0.6.4' ||
                repo.owner !== 'siarheisinelnikau' || repo.repo !== 'space-sniffer' ||
                tag !== 'v0.6.4' || sha !== process.env.RELEASE_SOURCE_SHA ||
                require('node:child_process').execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim() !== sha) {
              throw new Error('The authorized release ref and checked commit must match.');
            }
            const ref = `tags/${tag}`;
            try {
              await github.rest.git.getRef({...repo, ref});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...repo, ref: `refs/${ref}`, sha});
            }
            await publish({github, context: {repo, ref: `refs/${ref}`, sha}, core});
