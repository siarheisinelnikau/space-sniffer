name: Release

on:
  push:
    tags: ['v*']
    branches: ['codex/release-v*']
  create:

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: (github.event_name == 'push' && (github.ref_type == 'tag' || !github.event.created)) || (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'codex/release-v'))
    name: Build Windows executable
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_sha: ${{ steps.version.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'create' && github.event.ref || github.ref }}
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Verify release version
        id: version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.event_name == 'create' && github.event.ref || github.ref_name }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'space-sniffer').version
          $releaseTag = $env:RELEASE_REF -replace '^codex/release-', ''
          if ($releaseTag -ne "v$version") {
            throw "Release ref $env:RELEASE_REF must match package version v$version for in-app updates."
          }
          $notes = "docs/release-notes/$releaseTag.md"
          if (!(Test-Path -LiteralPath $notes -PathType Leaf) -or (Get-Item -LiteralPath $notes).Length -eq 0) {
            throw "Add verified English release notes at $notes before tagging."
          }
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Test draft recovery without GitHub requests
        run: node --test scripts/test_publish_release.cjs
      - name: Test
        run: cargo test --locked --all-targets --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Stage versioned executable
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $assetName = "SpaceSniffer-$env:RELEASE_TAG.exe"
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/release/space-sniffer.exe -Destination "release/$assetName"
          $digest = (Get-FileHash -LiteralPath "release/$assetName" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'release/SHA256SUMS.txt'), "$digest  $assetName`n", [Text.UTF8Encoding]::new($false))
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: |
            release/SpaceSniffer-${{ steps.version.outputs.release_tag }}.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish standalone executable
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.release_sha }}
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: release
      - name: Resume only the owned draft and publish verified assets
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        with:
          script: |
            const publish = require('./scripts/publish_release.cjs');
            await publish({github, context, core});
