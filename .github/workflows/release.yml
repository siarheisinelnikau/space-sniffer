name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Verify release version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'space-sniffer').version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME must match package version v$version for in-app updates."
          }
          $notes = "docs/release-notes/$env:GITHUB_REF_NAME.md"
          if (!(Test-Path -LiteralPath $notes -PathType Leaf) -or (Get-Item -LiteralPath $notes).Length -eq 0) {
            throw "Add verified English release notes at $notes before tagging."
          }
      - name: Test
        run: cargo test --locked --all-targets --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Stage versioned executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/release/space-sniffer.exe -Destination "release/SpaceSniffer-$env:GITHUB_REF_NAME.exe"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: release/SpaceSniffer-${{ github.ref_name }}.exe
          if-no-files-found: error

  publish:
    name: Publish standalone executable
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: release
      - name: Publish executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          executable="release/SpaceSniffer-${RELEASE_TAG}.exe"
          notes="docs/release-notes/${RELEASE_TAG}.md"
          test -s "$executable"
          test -s "$notes"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$executable" --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "$executable" \
              --verify-tag --title "Space Sniffer $RELEASE_TAG" --notes-file "$notes"
          fi
      - name: Keep the latest release only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          test "$asset" = "SpaceSniffer-${RELEASE_TAG}.exe"
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')
          if [ "$latest" != "$RELEASE_TAG" ]; then
            echo "Keeping newer release $latest; skipping cleanup for $RELEASE_TAG."
            exit 0
          fi
          gh release list --limit 1000 --json tagName --jq '.[].tagName' > previous-releases.txt
          while IFS= read -r previous_tag; do
            if [ "$previous_tag" != "$RELEASE_TAG" ]; then
              gh release delete "$previous_tag" --yes
            fi
          done < previous-releases.txt
