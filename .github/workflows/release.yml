name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libssl-dev
      - name: Test
        run: cargo test --locked --all-targets --target ${{ matrix.target }}
      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package executable and documentation
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import tarfile
          import zipfile

          target = os.environ["BUILD_TARGET"]
          name = f"space-sniffer-{target}"
          stage = Path("dist") / name
          stage.mkdir(parents=True, exist_ok=True)
          executable = "space-sniffer.exe" if "windows" in target else "space-sniffer"
          shutil.copy2(Path("target") / target / "release" / executable, stage / executable)
          for document in ("LICENSE", "README.md", "README.ru.md", "CONTRIBUTING.md"):
              shutil.copy2(document, stage / document)
          shutil.copytree("docs", stage / "docs", dirs_exist_ok=True)

          if "windows" in target:
              archive = Path("dist") / f"{name}.zip"
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as output:
                  for file in sorted(stage.rglob("*")):
                      if file.is_file():
                          output.write(file, file.relative_to(stage.parent))
          else:
              archive = Path("dist") / f"{name}.tar.gz"
              with tarfile.open(archive, "w:gz") as output:
                  output.add(stage, arcname=name)
          print(archive)
          PY
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - name: Create checksums
        working-directory: release
        run: sha256sum *.zip *.tar.gz > SHA256SUMS
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag --title "Space Sniffer $RELEASE_TAG" --generate-notes
          fi
