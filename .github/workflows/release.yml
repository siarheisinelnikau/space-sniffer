name: Release

on:
  push:
    tags: ['v*']
  create:

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name == 'push' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'codex/release-v'))
    name: Build Windows executable
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_sha: ${{ steps.version.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'create' && github.event.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Verify release version
        id: version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.event_name == 'create' && github.event.ref || github.ref_name }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'space-sniffer').version
          $releaseTag = $env:RELEASE_REF -replace '^codex/release-', ''
          if ($releaseTag -ne "v$version") {
            throw "Release ref $env:RELEASE_REF must match package version v$version for in-app updates."
          }
          $notes = "docs/release-notes/$releaseTag.md"
          if (!(Test-Path -LiteralPath $notes -PathType Leaf) -or (Get-Item -LiteralPath $notes).Length -eq 0) {
            throw "Add verified English release notes at $notes before tagging."
          }
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Test
        run: cargo test --locked --all-targets --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Stage versioned executable
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/release/space-sniffer.exe -Destination "release/SpaceSniffer-$env:RELEASE_TAG.exe"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: release/SpaceSniffer-${{ steps.version.outputs.release_tag }}.exe
          if-no-files-found: error

  publish:
    name: Publish standalone executable
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.release_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: release
      - name: Publish executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          set -euo pipefail
          executable="release/SpaceSniffer-${RELEASE_TAG}.exe"
          notes="docs/release-notes/${RELEASE_TAG}.md"
          test -s "$executable"
          test -s "$notes"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$executable" --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "$executable" \
              --target "$RELEASE_SHA" --title "Space Sniffer $RELEASE_TAG" --notes-file "$notes"
          fi
      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          asset=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          test "$asset" = "SpaceSniffer-${RELEASE_TAG}.exe"
