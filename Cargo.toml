[package]
name = "space-sniffer"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
description = "A native, open-source disk usage explorer with an interactive treemap"
license = "MIT"

[features]
screenshots = ["eframe/__screenshot"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
rfd = "0.15"
notify = "8.2"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "windows")'.dependencies]
self-replace = "1.5"

[profile.release]
lto = "thin"
strip = true

