[package]
name = "space-sniffer"
version = "0.4.2"
edition = "2024"
rust-version = "1.88"
description = "A native, open-source disk usage explorer with an interactive treemap"
license = "MIT"

[features]
diagnostics = []
screenshots = ["eframe/__screenshot", "dep:image"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "persistence"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
rfd = "0.15"
notify = "8.2"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "windows")'.dependencies]
self-replace = "1.5"
bytemuck = "1.25"
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard", "links", "serde"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
ron = "0.11"
softbuffer = { version = "=0.4.8", default-features = false }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "x11", "wayland"] }

[profile.release]
lto = "thin"
strip = true

